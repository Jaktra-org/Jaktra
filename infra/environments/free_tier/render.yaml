  - type: web
    name: jaktra-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard from Neon Tech
      - key: REDIS_URL
        sync: false # Set in Render Dashboard from Upstash
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_ML_SERVICE_URL
        fromService:
          type: web
          name: jaktra-ai-service
          property: host
      - key: AI_ML_SERVICE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: PLATFORM_EMAIL_PROVIDER
        value: resend
      - key: PLATFORM_SENDGRID_API_KEY
        sync: false
      - key: PLATFORM_FROM_EMAIL
        value: no-reply@jaktra.site
      - key: PLATFORM_FROM_NAME
        value: Jaktra
      - key: CORS_ORIGINS
        value: https://jaktra.vercel.app,http://localhost:5173


  - type: web
    name: jaktra-ai-service
    runtime: docker
    dockerContext: ai-service
    dockerfilePath: ai-service/Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: SERVICE_HOST
        value: 0.0.0.0
      - key: SERVICE_PORT
        value: "8000"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_API_KEY
        sync: false
      - key: AI_ML_SERVICE_KEY
        sync: false
