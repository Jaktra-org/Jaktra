    <!-- Schema.org 4: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does the autonomous 5-stage cadence work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Jaktra continuously monitors invoice due dates and aging buckets. Based on your schedule configuration, it automatically advances accounts through 5 staged notices: from courteous pre-due reminders to firm overdue follow-ups and final demand notices. You configure the delay between stages and can require manual approval before any stage dispatches."
          }
        },
        {
          "@type": "Question",
          "name": "What happens when a debtor disputes an invoice?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The moment a debtor replies or submits a dispute through the self-service portal, Jaktra immediately pauses all cadence timers for that invoice. This prevents inappropriate automated collection notices while an issue is under review. Disputes are categorized with reason and notes, and an AI-drafted reply proposal is prepared for your team."
          }
        },
        {
          "@type": "Question",
          "name": "Does Jaktra send emails from my own domain?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Jaktra integrates directly with your SendGrid, Resend, or custom SMTP server. All outbound reminders and escalation notices originate from your verified business address (e.g., billing@yourcompany.com) with full SPF, DKIM, and DMARC alignment."
          }
        },
        {
          "@type": "Question",
          "name": "Can debtors set up installment payment plans?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. When debtors access their secure portal, they can request structured multi-part payment plans. Once approved, Jaktra generates individual installment schedules and tracks partial settlements, keeping collection cadences paused as long as installments remain on track."
          }
        },
        {
          "@type": "Question",
          "name": "How do debtors pay invoices through the portal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every notification includes a tokenized, zero-friction link to a branded Debtor Portal. Debtors require no password or login. They can view line items, download PDF copies, submit notes, and settle immediately via integrated online checkout (e.g., Razorpay)."
          }
        },
        {
          "@type": "Question",
          "name": "Can we control escalation tones and copy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. Each of the 5 escalation stages has customizable subject lines, email templates, and AI tone prompts (from courteous reminders to firm formal demand letters). You retain complete authority over your brand voice."
          }
        },
        {
          "@type": "Question",
          "name": "How do I import existing invoices into Jaktra?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can bulk-import invoices via CSV upload or synchronize them via our REST API. Jaktra automatically parses customer details, line items, currency, issue dates, and due dates, instantly slotting each account into its correct aging bucket."
          }
        },
        {
          "@type": "Question",
          "name": "How is debtor data isolated and secured?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Jaktra enforces strict tenant isolation at the database layer. All sensitive credentials—such as SMTP passwords and payment gateway secrets—are encrypted with AES-256 at rest. Webhook payloads are cryptographically signed using HMAC SHA-256, and data in transit is protected by TLS 1.3."
          }
        },
        {
          "@type": "Question",
          "name": "Is there an audit log of all communications?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Jaktra maintains an immutable, tenant-scoped Activity Log recording every event: email dispatch and delivery status, debtor payment link views, dispute submissions, installment agreements, and manual cadence overrides."
          }
        },
        {
          "@type": "Question",
          "name": "What is included in the Free plan?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Free plan includes up to 10 active invoices and 1 user seat with full access to the 5-stage cadence engine, debtor portal, CSV import, dispute detection, and SendGrid/SMTP delivery. It is permanently free with no credit card required."
          }
        },
        {
          "@type": "Question",
          "name": "Can multiple team members access the workspace?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Jaktra supports role-based team management (Admin, Member, and Auditor). You can invite finance colleagues with specific permissions, allowing AR specialists to manage cadences while safeguarding tenant configuration."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if an email bounces or delivery fails?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Jaktra captures webhook delivery events and tracks bounces or drops. Unrecoverable failures are routed to a built-in Dead-Letter Queue (DLQ) with diagnostics, ensuring your team can inspect issues without losing track of overdue accounts."
          }
        }
      ]
    }
    </script>
