name: Jaktra CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: jaktra
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d jaktra"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run database migrations
        run: npx tsx src/db/migrate.ts
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:rootpassword@127.0.0.1:5432/jaktra

      - name: Type-check
        run: npm run type-check
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend

      - name: Run backend tests
        run: npm run test:run
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:rootpassword@127.0.0.1:5432/jaktra
          JWT_SECRET: dev-secret-key-at-least-32-chars-long

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck / Build
        run: npm run build
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Run Vitest Unit/Component Tests
        run: npm run test
        working-directory: frontend

      - name: Install E2E Dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: tests/e2e

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: tests/e2e

      - name: Run Playwright E2E Tests
        run: npm run test
        working-directory: tests/e2e

  ai-service-ci:
    name: AI Service CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio joblib scikit-learn
          pip install -r requirements.txt
        working-directory: ai-service

      - name: Run tests
        run: python -m pytest test/ -v
        working-directory: ai-service
        env:
          PYTHONPATH: .
          ENVIRONMENT: development
          SERVICE_KEY: test-service-key
          LLM_API_KEY: test-llm-api-key
