name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip CI tests"
        type: boolean
        default: false
      force_deploy_all:
        description: "Force redeploy all services"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || inputs.force_deploy_all == true }}
      ai-service: ${{ steps.filter.outputs.ai-service == 'true' || inputs.force_deploy_all == true }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || inputs.force_deploy_all == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/ci.yml'
            ai-service:
              - 'ai-service/**'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/ci.yml'

  test:
    name: Run Test Suite
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ==========================================
  # 1. FRONTEND PIPELINE
  # ==========================================
  build-frontend:
    name: Build Frontend
    needs: [detect-changes, test]
    if: ${{ (needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and compile
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "❌ Error: Required secret VITE_API_BASE_URL is not configured in GitHub Repository Secrets."
            echo "👉 Please add VITE_API_BASE_URL under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npm ci
          npm run build

  deploy-frontend:
    name: Deploy Frontend
    needs: [build-frontend]
    if: ${{ needs.build-frontend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Deploy Frontend
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "❌ Error: Required secret VERCEL_TOKEN is not configured in GitHub Repository Secrets."
            echo "👉 Please add VERCEL_TOKEN under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "❌ Error: Required secret VITE_API_BASE_URL is not configured in GitHub Repository Secrets."
            echo "👉 Please add VITE_API_BASE_URL under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "⚡ Deploying Frontend to Vercel Production..."
          npm ci && npm run build
          npx -y vercel deploy --prod --token "$VERCEL_TOKEN" --yes

  # ==========================================
  # 2. BACKEND PIPELINE
  # ==========================================
  build-backend:
    name: Build Backend
    needs: [detect-changes, test]
    if: ${{ (needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies and compile
        working-directory: backend
        run: |
          npm ci
          npm run type-check
          npm run build

  deploy-backend:
    name: Deploy Backend
    needs: [build-backend]
    if: ${{ needs.build-backend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Backend Redeploy
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_BACKEND_DEPLOY_HOOK" ]; then
            echo "❌ Error: Required secret RENDER_BACKEND_DEPLOY_HOOK is not configured in GitHub Repository Secrets."
            echo "👉 Please copy the Deploy Hook from Render Dashboard (jaktra-backend -> Settings -> Deploy Hook) and add it to GitHub Secrets."
            exit 1
          fi
          echo "⚡ Triggering Backend redeploy with cache refresh..."
          HOOK_URL="$RENDER_BACKEND_DEPLOY_HOOK"
          if [[ "$HOOK_URL" == *"?"* ]]; then
            HOOK_URL="${HOOK_URL}&clearCache=clear"
          else
            HOOK_URL="${HOOK_URL}?clearCache=clear"
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK_URL")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✓ Backend deployment triggered successfully (HTTP $HTTP_STATUS)!"
          else
            echo "❌ Error: Failed to trigger Render backend deployment (HTTP $HTTP_STATUS)."
            exit 1
          fi

  # ==========================================
  # 3. AI SERVICE PIPELINE
  # ==========================================
  build-ai-service:
    name: Build AI Service
    needs: [detect-changes, test]
    if: ${{ (needs.detect-changes.outputs.ai-service == 'true' || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies and compile
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile src/api/main.py

  deploy-ai-service:
    name: Deploy AI Service
    needs: [build-ai-service]
    if: ${{ needs.build-ai-service.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AI Service Redeploy
        env:
          RENDER_AI_SERVICE_DEPLOY_HOOK: ${{ secrets.RENDER_AI_SERVICE_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_AI_SERVICE_DEPLOY_HOOK" ]; then
            echo "❌ Error: Required secret RENDER_AI_SERVICE_DEPLOY_HOOK is not configured in GitHub Repository Secrets."
            echo "👉 Please copy the Deploy Hook from Render Dashboard (jaktra-ai-service -> Settings -> Deploy Hook) and add it to GitHub Secrets."
            exit 1
          fi
          echo "⚡ Triggering AI Service redeploy with cache refresh..."
          HOOK_URL="$RENDER_AI_SERVICE_DEPLOY_HOOK"
          if [[ "$HOOK_URL" == *"?"* ]]; then
            HOOK_URL="${HOOK_URL}&clearCache=clear"
          else
            HOOK_URL="${HOOK_URL}?clearCache=clear"
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK_URL")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✓ AI Service deployment triggered successfully (HTTP $HTTP_STATUS)!"
          else
            echo "❌ Error: Failed to trigger Render AI service deployment (HTTP $HTTP_STATUS)."
            exit 1
          fi
