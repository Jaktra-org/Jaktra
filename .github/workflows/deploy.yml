name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip CI tests"
        type: boolean
        default: false
      force_deploy_all:
        description: "Force redeploy all services"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || inputs.force_deploy_all == true }}
      ai-service: ${{ steps.filter.outputs.ai-service == 'true' || inputs.force_deploy_all == true }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || inputs.force_deploy_all == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/ci.yml'
            ai-service:
              - 'ai-service/**'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/ci.yml'

  test:
    name: Run Test Suite
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-backend:
    name: Build Backend
    needs: [detect-changes, test]
    if: ${{ (needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies and compile
        working-directory: backend
        run: |
          npm ci
          npm run type-check
          npm run build

  build-ai-service:
    name: Build AI Service
    needs: [detect-changes, test]
    if: ${{ (needs.detect-changes.outputs.ai-service == 'true' || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies and compile
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile src/api/main.py

  deploy-frontend:
    name: Deploy Frontend
    needs: [detect-changes, test]
    if: ${{ (needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy Frontend
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "⚡ Deploying Frontend Production..."
            npx -y vercel deploy --prod --token "$VERCEL_TOKEN" --yes
          else
            echo "ℹ️ VERCEL_TOKEN not set in GitHub Secrets. Skipping Vercel deploy."
          fi

  deploy-backend:
    name: Deploy Backend
    needs: [detect-changes, test, build-backend]
    if: ${{ (needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.build-backend.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Backend Redeploy
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_BACKEND_DEPLOY_HOOK" ]; then
            echo "⚡ Triggering Backend redeploy with cache refresh..."
            curl -s -X POST "$RENDER_BACKEND_DEPLOY_HOOK?clearCache=clear"
            echo "✓ Backend deployment triggered successfully!"
          else
            echo "ℹ️ RENDER_BACKEND_DEPLOY_HOOK not set. Service will auto-deploy from GitHub commit push."
          fi

  deploy-ai-service:
    name: Deploy AI Service
    needs: [detect-changes, test, build-ai-service]
    if: ${{ (needs.detect-changes.outputs.ai-service == 'true' || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.build-ai-service.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Trigger AI Service Redeploy
        env:
          RENDER_AI_SERVICE_DEPLOY_HOOK: ${{ secrets.RENDER_AI_SERVICE_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_AI_SERVICE_DEPLOY_HOOK" ]; then
            echo "⚡ Triggering AI Service redeploy with cache refresh..."
            curl -s -X POST "$RENDER_AI_SERVICE_DEPLOY_HOOK?clearCache=clear"
            echo "✓ AI Service deployment triggered successfully!"
          else
            echo "ℹ️ RENDER_AI_SERVICE_DEPLOY_HOOK not set. Service will auto-deploy from GitHub commit push."
          fi
